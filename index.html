*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--white);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}

.wrap{max-width:1040px;margin:0 auto;padding:0 24px}

header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:20px;flex-wrap:wrap}
.brand{color:#fff;font-weight:600;letter-spacing:.2px;text-decoration:none}
.brand span{color:#60a5fa}
.langs{display:flex;gap:8px;flex-wrap:wrap}
.langs button{font:500 13px var(--sans);color:#e2e8f0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;cursor:pointer}
.langs button:hover{background:rgba(255,255,255,.18)}
.langs button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}

/* hero */
.hero{background:radial-gradient(1200px 500px at 50% -10%,#16233d 0%,var(--navy) 60%);color:#fff;text-align:center;padding:150px 0 100px}
.tag{display:inline-block;font-size:13px;color:#cbd5e1;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 16px;margin-bottom:28px}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,5.2vw,54px);line-height:1.15;margin:0 auto 22px;max-width:18ch}
.hero p{max-width:60ch;margin:0 auto 34px;color:#cbd5e1;font-size:clamp(16px,2vw,19px)}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 15px var(--sans);text-decoration:none;border-radius:999px;padding:13px 26px;border:0;cursor:pointer}
.btn-white{background:#fff;color:var(--ink)}
.btn-white:hover{background:#e2e8f0}

/* sections */
section{padding:84px 0}
h2{font-family:var(--serif);font-size:clamp(26px,3.4vw,36px);margin:0 0 18px;line-height:1.2}

.about .grid{display:grid;grid-template-columns:240px 1fr;gap:56px;align-items:center}
.avatar{width:160px;height:160px;border-radius:50%;background:var(--navy2);display:grid;place-items:center;margin:0 auto;box-shadow:0 14px 34px rgba(15,23,42,.25)}
.avatar svg{width:64px;height:64px;stroke:#fff}
.about p{margin:0 0 14px;color:var(--muted);max-width:68ch}
.stats{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 26px;text-align:center;min-width:150px}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}

.services{background:var(--soft)}
.services .head{text-align:center;max-width:70ch;margin:0 auto 46px}
.services .head p{color:var(--muted);margin:0}
.bar{width:44px;height:3px;background:var(--blue);margin:20px auto 0;border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.card{grid-column:span 2;background:#fff;border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:12px}
.card:nth-child(4),.card:nth-child(5){grid-column:span 3}
.ico{width:38px;height:38px;border-radius:9px;background:#eaf1ff;display:grid;place-items:center}
.ico svg{width:20px;height:20px;stroke:var(--blue)}
.card h3{font-size:16px;line-height:1.35;margin:0}
.card p{font-size:14.5px;color:var(--muted);margin:0;flex:1}
.price{align-self:flex-start;font-size:12.5px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px}

.contact{text-align:center}
.box{max-width:620px;margin:0 auto;background:var(--navy2);color:#fff;border-radius:18px;padding:44px 30px;box-shadow:0 24px 50px rgba(15,23,42,.28)}
.box .circle{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:0 auto 18px}
.box .circle svg{width:26px;height:26px;stroke:var(--ink)}
.box h2{color:#fff}
.box p{color:#cbd5e1;margin:0 auto 20px;max-width:52ch}
.box .name{color:#fff;font-weight:600;margin:6px 0 0}
.box .role{font-size:14px;color:#93c5fd;margin:0 0 26px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-wa{background:var(--green);color:#052e13}
.btn-wa:hover{background:#4ade80}
.btn-mail{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.btn-mail:hover{background:rgba(255,255,255,.12)}
.btn svg{width:18px;height:18px;stroke:currentColor}

footer{border-top:1px solid var(--line);padding:26px 0;text-align:center;font-size:13.5px;color:var(--muted)}
footer p{margin:2px 0}

@media (max-width:860px){
  .about .grid{grid-template-columns:1fr;gap:30px}
  .cards{grid-template-columns:1fr}
  .card,.card:nth-child(4),.card:nth-child(5){grid-column:auto}
  .hero{padding:170px 0 80px}
  section{padding:64px 0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

function setLang(l){
  if(!T[l]) l="tr";
  var d=T[l];
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(function(el){
    var k=el.getAttribute("data-i"); if(d[k]!==undefined) el.textContent=d[k];
  });
  document.querySelectorAll(".langs button").forEach(function(b){
    b.setAttribute("aria-pressed", b.dataset.lang===l ? "true":"false");
  });
  document.title="Tuncay ERGİN | "+d.h1;
}

  b.addEventListener("click",function(){ setLang(b.dataset.lang); });
});
