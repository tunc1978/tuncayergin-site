function setLang(l){
  if(!T[l]) l="tr";
  var d=T[l];
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(function(el){
    var k=el.getAttribute("data-i"); if(d[k]!==undefined) el.textContent=d[k];
  });
  document.querySelectorAll(".langs button").forEach(function(b){
    b.setAttribute("aria-pressed", b.dataset.lang===l ? "true":"false");
  });
  document.title="Tuncay ERGİN | "+d.h1;
  document.getElementById("fab").setAttribute("aria-label",d.wa);
}
document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click",function(){ setLang(b.dataset.lang); });
});
document.getElementById("wa").href=WHATSAPP_URL;
document.getElementById("fab").href=WHATSAPP_URL;

  var fab=document.getElementById("fab"), box=document.getElementById("kontakt");
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(e){ fab.classList.toggle("hide",e[0].isIntersecting); },{threshold:.35}).observe(box);
  }
})();
